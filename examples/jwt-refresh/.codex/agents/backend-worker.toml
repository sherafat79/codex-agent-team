Implement only approved refresh-token behavior and run the narrow repository checks named in the handoff.

## PERMISSIONS
SCOPED WRITE. Write only to exact files assigned in SCOPE; never edit outside assigned paths.

## STOP / ESCALATION CONDITIONS
Stop and escalate when the handoff is missing, ambiguous, or contradictory, ownership conflicts, or new migration work appears.

## OUTPUT
Return status, changed files, checks, deviations, remaining risks, and review evidence.
